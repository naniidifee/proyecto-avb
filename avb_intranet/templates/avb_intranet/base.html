<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Liceo TP Antonio Varas de la Barra{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  {% load static %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
</head>
<body>
  <!-- BARRA SUPERIOR -->
  <div class="topbar">
    <div class="topbar-info">
      <span><i class="fas fa-map-marker-alt"></i> Arica, Chile</span>
      <span><i class="fas fa-phone"></i> +56 58 2234567</span>
    </div>
  </div>

  <!-- NAVEGACIÓN -->
  <nav>
    <a href="{% url 'index' %}" class="nav-logo">
      <strong>Liceo Antonio Varas</strong>
      <span>de la Barra • Arica</span>
    </a>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  {% block content %}{% endblock %}

</body>
</html>
