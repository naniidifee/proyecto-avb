{% extends 'avb_intranet/base.html' %}

{% block title %}Intranet - Liceo Antonio Varas de la Barra{% endblock %}

{% block content %}
<section class="intranet-section">
  <div class="intranet-box">
    <span class="section-label">Acceso Restringido</span>
    <h2>Intranet Institucional</h2>
    <p>Portal de acceso para docentes, estudiantes y apoderados.</p>
    
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Usuario / RUT</label>
        <input type="text" name="username" id="username" class="form-control" required placeholder="Ingrese su RUT o usuario">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Sistema
      </button>
    </form>
  </div>
</section>
{% endblock %}
